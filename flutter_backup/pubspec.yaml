name: lydo_youth
description: LYDO Youth Portal Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Camera & Photos
  camera: ^0.10.5+5
  image_picker: ^1.0.4
  
  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  
  # QR Code
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
